<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#0d1117"/>
  
  <!-- Neural Network Nodes -->
  <g id="nodes">
    <!-- Input Layer -->
    <circle cx="100" cy="100" r="20" fill="#1abc9c">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="200" r="20" fill="#1abc9c">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite" begin="0.3s"/>
    </circle>
    <circle cx="100" cy="300" r="20" fill="#1abc9c">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite" begin="0.6s"/>
    </circle>

    <!-- Hidden Layer 1 -->
    <circle cx="300" cy="150" r="20" fill="#1abc9c">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite" begin="0.2s"/>
    </circle>
    <circle cx="300" cy="250" r="20" fill="#1abc9c">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite" begin="0.5s"/>
    </circle>

    <!-- Hidden Layer 2 -->
    <circle cx="500" cy="200" r="20" fill="#1abc9c">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite" begin="0.4s"/>
    </circle>

    <!-- Output Layer -->
    <circle cx="700" cy="200" r="20" fill="#1abc9c">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite" begin="0.7s"/>
    </circle>
  </g>

  <!-- Neural Network Connections -->
  <g id="connections" stroke="#2ecc71" stroke-width="2">
    <!-- Input to Hidden Layer 1 -->
    <line x1="120" y1="100" x2="280" y2="150">
      <animate attributeName="stroke-opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite"/>
    </line>
    <line x1="120" y1="100" x2="280" y2="250">
      <animate attributeName="stroke-opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite" begin="0.2s"/>
    </line>
    <line x1="120" y1="200" x2="280" y2="150">
      <animate attributeName="stroke-opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite" begin="0.3s"/>
    </line>
    <line x1="120" y1="200" x2="280" y2="250">
      <animate attributeName="stroke-opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite" begin="0.4s"/>
    </line>
    <line x1="120" y1="300" x2="280" y2="150">
      <animate attributeName="stroke-opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite" begin="0.5s"/>
    </line>
    <line x1="120" y1="300" x2="280" y2="250">
      <animate attributeName="stroke-opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite" begin="0.6s"/>
    </line>

    <!-- Hidden Layer 1 to Hidden Layer 2 -->
    <line x1="320" y1="150" x2="480" y2="200">
      <animate attributeName="stroke-opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite" begin="0.3s"/>
    </line>
    <line x1="320" y1="250" x2="480" y2="200">
      <animate attributeName="stroke-opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite" begin="0.5s"/>
    </line>

    <!-- Hidden Layer 2 to Output -->
    <line x1="520" y1="200" x2="680" y2="200">
      <animate attributeName="stroke-opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite" begin="0.7s"/>
    </line>
  </g>

  <!-- Data Flow Animation -->
  <g id="data-particles">
    <circle r="4" fill="#3498db">
      <animateMotion path="M100,100 L300,150 L500,200 L700,200" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle r="4" fill="#3498db">
      <animateMotion path="M100,200 L300,250 L500,200 L700,200" dur="3s" repeatCount="indefinite" begin="1s"/>
    </circle>
    <circle r="4" fill="#3498db">
      <animateMotion path="M100,300 L300,150 L500,200 L700,200" dur="3s" repeatCount="indefinite" begin="2s"/>
    </circle>
  </g>

  <!-- Labels -->
  <text x="100" y="350" fill="#ffffff" text-anchor="middle" font-family="Arial" font-size="14">Input Layer</text>
  <text x="300" y="350" fill="#ffffff" text-anchor="middle" font-family="Arial" font-size="14">Hidden Layer 1</text>
  <text x="500" y="350" fill="#ffffff" text-anchor="middle" font-family="Arial" font-size="14">Hidden Layer 2</text>
  <text x="700" y="350" fill="#ffffff" text-anchor="middle" font-family="Arial" font-size="14">Output Layer</text>
</svg>